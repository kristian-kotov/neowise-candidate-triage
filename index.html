<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #draft { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite">
    <p id="status"></p>
    <p id="topic" hidden></p>
    <p id="draft" hidden></p>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const status = document.querySelector("#status");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const button = form.querySelector("button");
    const topicNames = {
      delivery: "Доставка",
      pricing: "Цена",
      other: "Другое",
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      topic.hidden = true;
      draft.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
      status.textContent = "Разбираем заявку…";
      button.disabled = true;

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const result = await reply.json();
        if (result.status === "ready") {
          status.textContent = "Проверьте черновик перед отправкой клиенту.";
          topic.textContent = `Тема: ${topicNames[result.topic]}`;
          draft.textContent = `Черновик ответа: ${result.draft}`;
          topic.hidden = false;
          draft.hidden = false;
        } else if (result.status === "manual_review") {
          status.textContent = "Не удалось подготовить ответ. Разберите заявку вручную.";
        } else if (result.status === "invalid_input") {
          status.textContent = "Введите текст заявки.";
        } else {
          status.textContent = "Не удалось разобрать заявку. Попробуйте ещё раз.";
        }
      } catch {
        status.textContent = "Нет связи с сервером. Попробуйте ещё раз.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
